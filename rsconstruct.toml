# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[processor.shellcheck]
src_dirs = ["scripts"]
args = ["--severity=error", "--shell=bash"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# Site build, formerly the Makefile's jekyll rule: render blog/ into the
# committed docs/ folder that GitHub Pages serves, then drop the unpublished
# feed.xml. The native jekyll processor can't express this (it hardcodes
# _site/ next to _config.yml and can't run the feed removal), so the build
# lives in scripts/build_docs.sh behind the explicit processor. `bundle` is
# declared so `rsconstruct tools install` provides bundler; the gems
# themselves come from the `bundle install` the script runs against the
# root Gemfile.lock before building.
[processor.explicit.build_docs]
command = "scripts/build_docs.sh"
required_tools = ["bundle"]
inputs = ["scripts/build_docs.sh", "Gemfile", "Gemfile.lock"]
input_globs = ["blog/**"]
output_dirs = ["docs"]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
# actionlint 1.7.12's runner-label list predates the official ubuntu-26.04
# hosted runner; drop this ignore once a newer actionlint knows the label
args = ["-ignore", 'label "ubuntu-26\.04" is unknown']
