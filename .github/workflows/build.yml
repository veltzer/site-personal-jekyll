name: build
on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/cache@v5
      with:
        path: .rsconstruct
        # Primary key is unique per run so every successful run saves a fresh
        # cache. restore-keys lets the run start from the most recent cache
        # matching the prefix. Without this (static key), actions/cache never
        # re-saves once the first cache exists.
        key: rsconstruct-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          rsconstruct-${{ runner.os }}-
    - name: configure gem environment
      # The runner's ruby comes from apt, so `gem install` targets
      # /var/lib/gems, which the runner user cannot write. Point gem and
      # bundler at a user-writable GEM_HOME instead, and put its bin dir on
      # PATH so the installed `bundle` executable resolves in later steps.
      run: |
        echo "GEM_HOME=$HOME/.gem" >> "$GITHUB_ENV"
        echo "$HOME/.gem/bin" >> "$GITHUB_PATH"
    - name: install rsconstruct
      run: |
        gh release download --repo veltzer/rsconstruct --pattern 'rsconstruct-linux-x86_64' --output /usr/local/bin/rsconstruct
        chmod +x /usr/local/bin/rsconstruct
        rsconstruct version
      env:
        GH_TOKEN: ${{ github.token }}
    - name: install
      run: |
        rsconstruct tools install-deps
        rsconstruct tools install
    - name: build
      run: rsconstruct build
    - name: status
      run: rsconstruct status
